# Bot cron specs — session-scope CronCreate jobs that must be recreated every
# time a bot's Claude Code session restarts. Injected into the boot relay
# message by start.sh → bot-crons-prompt.sh.
#
# Source of truth = each bot's CLAUDE.md. Do not invent new jobs here; mirror
# the spec exactly so behaviour matches what each bot's persona expects.
#
# ⚠️ Keys are BOT_NAME (the value of BOT_NAME= in bots/<dir>/start.sh), which is
# what boot-relay passes to bot-crons-prompt.sh. After the 2026 bot renames it is
# NOT always the same as the bots/ directory name — e.g. dir `elon` has
# BOT_NAME=chltao, dir `panda` has BOT_NAME=ron-assistant. Auditing this file
# against `ls bots/` therefore gives the wrong answer in both directions.
# Cross-check with: grep -m1 '^BOT_NAME=' bots/<dir>/start.sh
#
# Schema:
#   <BOT_NAME>:
#     - cron: "<5-field cron expression>"   # server local time (TZ where bot runs)
#       prompt: "<prompt executed by the scheduled agent>"
#       recurring: true

anya:
  - cron: "*/30 * * * *"
    prompt: "執行 `bash /home/oldrabbit/.claude-bots/shared/loops/clean-tree-guard/clean-tree-guard.sh`，若輸出 ALERT 或 exit 非 0，立即檢查 relay 與 logs/clean-tree-guard/；不可自動 revert 安全關鍵檔。"
    recurring: true
  - cron: "17 9 * * *"
    prompt: "執行 `bash /home/oldrabbit/.claude-bots/shared/bin/fatq-closeout-sweep.sh`，掃描新制 done 任務中超過 24 小時仍未 closed 者；腳本會原子產生 relay 告警並抑制同 task_id 重複通知。若 exit 非 0，檢查 closeout sweep state/relay，但不可手改 closeout.*，只能走 `fatq-cli.sh closeout`。"
    recurring: true
  - cron: "57 8 * * *"
    # 2026-08-24: Google Calendar 步驟已移除。normal2 帳號 token 自 2026-08-20 起
    # 持續 invalid/expired，每天只會產出一段空行程。老兔重新授權後把下一行的
    # 「拉 Google Calendar 今日 events，」加回即可復原。
    prompt: "用 background agent（sonnet，maxTurns=15）執行今日 Daily Note 建立：取今天日期（CST），若 ~/Documents/Obsidian Vault - OldRabbit/00Daily/{today}.md 不存在則建立並填入 frontmatter。從前一天 Daily Note 找未完成項目，補寫今日代辦區塊。TG 私訊老兔（chat_id: 1050312492）：今日代辦摘要。"
    recurring: true
  - cron: "3 18 * * *"
    prompt: "用 background agent（sonnet，maxTurns=30）執行今日 Daily Note 下半段補寫：整理今天對話記錄，歸納主要貢獻和時間線，補寫 Compiled Truth + Timeline + 今日 Pearl。將 Compiled Truth prepend 進 WorkJournal.md。掃 FATQ tasks 整理今日完成/未完成事項。TG 私訊老兔（chat_id: 1050312492）：今日收工日誌摘要。如果今天老兔主動回報的完成事項不到 2 件，額外問有沒有要記錄的。"
    recurring: true
  - cron: "7 10 1 * *"
    prompt: "【月度 Comprehension-Debt 引導審查（老兔 2026-06-23 拍板，Loop Engineering step 13）】用 background agent（sonnet，maxTurns=30）執行：①掃過去一個月 tasks/done/ 的 FATQ 任務，優先抽 3-5 個重要的（P0/P1、改 shared 基建、改 daemon/schema、涉資安資金資料、跨 bot）。②對每個取 git diff/commit，產出白話摘要：改了什麼、為什麼、影響、有無看起來不對勁/該追的（風險標紅）。③檢查這個月 builder/reviewer 的 permission scope 有無異動或過寬。④重點＝引導式、不丟生 diff：用白話講「這個月動了這些、建議你特別看這幾項、我對風險的判斷」，預判老兔看不懂處主動解釋。Anya 整理後 TG 私訊老兔（chat_id: 1050312492）：月度系統健康+變更引導摘要 + 「需要你親自看一眼」清單（≤3 項，各一句說為什麼）。老兔不一定看得懂 diff、需被引導，digest 要讓他不懂技術也能判斷。"
    recurring: true
  - cron: "0 10 * * 1"
    prompt: "【Loop Autonomous Discovery（老兔 2026-07-03 核准，Loop Engineering gap #1）】用 background agent（sonnet，maxTurns=30）執行：跑 `python3 /home/oldrabbit/.claude-bots/shared/scripts/loop-discovery-scan.py`（不加 --dry-run，真的跑）。此腳本會自動掃 tasks/done/ 的 lessons_learned/learnings 重複教訓、近 7 天 logs 的重複錯誤模式、tasks/review/ 卡住的 stale 任務，產出 0-N 個 draft task JSON 到 tasks/drafts/ + 一份 discovery-summary-*.md 摘要。⚠️硬紅線：此腳本絕不會、也不能寫入 tasks/pending/（human-in-loop 安全閥，已在腳本內建紅線稽核）。跑完**不用主動 TG 通知老兔**——只需確認腳本 exit 0，草稿留在 tasks/drafts/ 等 Anya 自己檢查週期時翻閱，覺得值得推進的再手動 mv 進 tasks/pending/ 啟動 FATQ 派工流程。"
    recurring: true

