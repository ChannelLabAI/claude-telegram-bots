    prompt: "【Kobo 閱讀器促銷追蹤 · 每週一】（33 於 2026-08-23 交辦，原記於 bots/huizhang/user-crons.json 的 kobo-ereader-promo-weekly-watch）派 background agent 查 Kobo 台灣電子閱讀器硬體是否有新的促銷方案，所有外部呼叫加 hard timeout，禁止編造價格：①Kobo 官方 FB 粉專 facebook.com/KoboTWN（優惠多半只在這裡先發）與 kobo.com/tw 活動頁；②樂天市場 Kobo 官方店、momo、PChome、蝦皮的 Kobo 閱讀器價格；③讀墨 Readmoo mooInk 有無對打促銷。基準價（2026-08-24 查得，用來判斷是否真的降價）：Kobo Clara BW 6吋黑白 5599、Kobo Libra Colour 7吋 8799、讀墨 mooInk Nana 7吋彩色 9299；2025 週年慶實績 Clara BW ＋保護殼 4699、Libra Colour ＋保護套 7899 ＋800 購書金；2026 台北國際書展實績（全年最強）閱讀器 68 折起、單機最高省 1680。回報紀律最重要：只有在出現比基準價更好的方案時才 TG 私訊 33（chat_id: 2106884013）；沒有新促銷或折扣沒優於基準價就不要發訊息，保持安靜。有發現時直接給結論——現在買划算還是等明年 2 月書展，並提醒 2026 是漲價年（3-6 月全品牌調漲 3.6%-14.3%），年底促銷可能只回到年初價位。"
    recurring: true

