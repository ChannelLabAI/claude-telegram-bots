<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChannelLab MVP</title>
  <style>body{font:16px system-ui;margin:0;background:#0b1020;color:#f3f5fa}main{max-width:760px;margin:10vh auto;padding:32px}section{background:#151c31;border-radius:16px;padding:24px}</style>
</head>
<body><main><section><h1>ChannelLab MVP</h1><p id="status">正在確認登入狀態…</p></section></main>
<script>
fetch('/api/me',{credentials:'same-origin'}).then(async response => {
  if (!response.ok) throw new Error(String(response.status));
  const me=await response.json();
  document.querySelector('#status').textContent=me?.name ? `歡迎，${me.name}` : '已登入';
}).catch(()=>{ document.querySelector('#status').textContent='請登入以繼續'; });
</script></body></html>
