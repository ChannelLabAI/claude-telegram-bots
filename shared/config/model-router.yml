# ChannelLab Bot System — Model Router v1
# 任務類型 → 模型路由的唯一配置來源
# 所有 bot 派發 sub-agent 前應查此檔，不在 CLAUDE.md hardcode 模型名
# Created: 2026-05-03 | Owner: Anya | Escalation: 老兔
#
# Gate convention: downgrades under bot_defaults must include gate:<report-path>.
# Reports live in handover/model-gate/<date>-<bot>.md and are generated by shared/bin/model-gate-report.sh.
# Emergency downgrades may land first, but need a report plus graduated_invariant within 48h.

# ── 任務路由規則 ──────────────────────────────────────────
routes:
  # 戰略決策、取捨評估、意圖模糊、跨職能判斷、[ESCALATION] 情境
  strategic: claude-opus

  # Builder mid-task advisor checkpoint：短 brief、短回覆，禁長對話
  advisor: claude-opus

  # 程式碼生成、技術實作、開發任務
  coding: claude-sonnet

  # 研究整理、分析、多步驟推理、spec 撰寫
  analysis: claude-sonnet

  # 批量處理、格式轉換、簡單摘要、fire-and-forget
  batch: claude-haiku

  # 圖像／視覺分析（暫用 sonnet；future: gemini-pro via OpenRouter）
  vision: claude-sonnet

  # 進階程式碼生成（預留，待 OpenRouter 設定後啟用）
  # coding-advanced: openai/gpt-5

# ── Provider 後端 ─────────────────────────────────────────
# current:  anthropic-direct（直接 Anthropic API，按 token 計費）
# planned:  openrouter（單一 key 存取 Claude + GPT-5 + Gemini + Llama）
provider: anthropic-direct

# ── 模型別名對照表（實際 model ID）──────────────────────────
models:
  claude-opus:   claude-opus-4-8
  claude-sonnet: claude-sonnet-5
  claude-fable:  claude-fable-5
  claude-haiku:  claude-haiku-4-5-20251001
  claude-opus-5: claude-opus-5

# ⚠️ 本區塊只適用 claude 引擎的 bot。codex 引擎的 bot（anna / sancai / eric /
# sara / spark / orange）刻意不列在這裡——他們的實際模型由下方 codex.bot_defaults
# 的 tier 決定（2026-08-26 全隊 /proc 實測：anna / sancai / sara / eric 為
# gpt-5.6-sol、orange 為 gpt-5.6-terra、spark 為 gpt-5.3-codex-spark）。
#
# 2026-08-26 移除了他們原本列在此處的 claude-sonnet 條目：那些值從未生效，
# 卻讓人（包括 anya 自己）誤以為 anna 是 claude bot，並據此對老兔做出過錯誤回報。
# 移除前後以 MODEL_ROUTER_YML 指向副本、對全部 21 個 bot 比對 model-resolve.sh
# 的解析結果，21/21 完全相同，確認純屬移除誤導而不改變任何行為。
#
# ⚠️ 仍存在的陷阱：對 codex bot 呼叫 model-resolve.sh 會落到下方 _default 而
# 得到 claude-sonnet-5——那是無意義的值，不代表該 bot 真的跑 claude。
# 查 bot 實際模型的唯一可靠方式是 /proc，見 bots/anya/bin/model-observer.sh。
bot_defaults:
  anya: claude-opus-5
  diana: claude-opus-5
  bella: claude-sonnet
  buddy: claude-sonnet
  elon: claude-sonnet
  fengfeng: claude-sonnet
  huizhang: claude-opus-5
  kk: claude-sonnet
  panda: claude-sonnet
  stargazer: claude-opus
  twinkle: claude-opus-5
  yitang: claude-sonnet
  zhanglinghe: claude-sonnet
  zhuchu: claude-opus-5
  _default: claude-sonnet

# ── Codex 引擎分級（codex CLI 0.143.0 實測 catalog）──────────
# CLI evidence 2026-07-18:
# - `codex debug models` lists gpt-5.5 and gpt-5.3-codex-spark.
# - Both list supported reasoning levels: low, medium, high, xhigh.
# - `codex exec --strict-config -c model_reasoning_effort="low"` accepts the key;
#   `-c reasoning_effort="low"` is rejected as an unknown field.
codex:
  # 目錄實查 2026-07-19（codex-cli 0.144.6 debug models，全部真探針過 sol）：
  # gpt-5.6-sol(低→ultra,預設low) / gpt-5.6-terra(低→ultra,預設medium) / gpt-5.6-luna(低→max,預設medium)
  # gpt-5.5(低→xhigh) / gpt-5.3-codex-spark(低→xhigh,預設high)
  tiers:
    sol:
      label: "5.6 Sol"
      model: gpt-5.6-sol
      reasoning_effort: high
    terra:
      label: "5.6 Terra"
      model: gpt-5.6-terra
      reasoning_effort: medium
    luna:
      label: "5.6 Luna"
      model: gpt-5.6-luna
      reasoning_effort: medium
    gpt55:
      label: "5.5"
      model: gpt-5.5
      reasoning_effort: medium
    spark:
      label: "5.3 Codex Spark"
      model: gpt-5.3-codex-spark
      reasoning_effort: high
  bot_defaults:
    anna: sol
    sancai: sol   # 2026-07-25 早回滾：7/19 降檔觀察觸發 kill criteria（f9e2+9a48 連續兩單 execution_error，1398 豁免不計），terra→sol，anya 執行
    eric: sol   # 2026-08-26 老兔確認：設定本就是 sol，此處 terra 屬資料漂移。/proc 實測 eric 跑 gpt-5.6-sol 且 reasoning_effort=high（完整命中 sol tier 兩欄），eric 本人核對後亦主動回報設定與實況不符。anya 修正。
    spark: spark
    interns: luna
    sara: sol
    orange: terra   # Donna 特助；老兔 2026-07-19 拍板觀察 codex 當特助表現（原 pod 隱式 luna→明式 terra）
    # Codex-only tier map. Legacy Claude start.sh resolves tier aliases through
    # its fail-safe table and must never pass sol/terra/luna to `claude --model`.
    stargazer: claude-opus
    _default: terra
