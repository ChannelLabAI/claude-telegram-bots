# Bot Routing Config — 優先路由規則
#
# 本檔的 bot_roster 是團隊 bot 名冊的權威來源。新增、移除或重新命名
# bot 時，必須同步更新本檔、shared/config/bot-identity-map.yml 與
# shared/bin/fatq-dispatch.sh 的映射（後者須另案審查）。Codex 引擎 bot 的
# 角色定義可只存在於 AGENTS.md；盤點不得只掃 CLAUDE.md。
# 派活邏輯：任務有業務標籤 → 找有對應標籤的最閒 bot
#            沒有匹配標籤  → 退化到「找最閒的 bot」
# 更新日期：2026-08-08（加入權威名冊與 Codex 盤點規則）

# ── 權威 bot 名冊 ───────────────────────────────────────
# id 是名冊身份錨點；directory 是 bots/ 下實體目錄。routing 的舊 id
# （例如 ron-reviewer）仍保留在對照表，避免直接改生產派工語義。nicky-builder 已於
# 2026-08-26 依老兔裁定改為 twinkle，三處（id/directory/dispatch_key）一致。
