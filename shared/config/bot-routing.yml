# ── 角色對應總表 ────────────────────────────────────────
# 目錄            Persona    Handle              角色
# anya            Anya       @Anyachl_bot        特助（老兔）
# ron-assistant   Panda      @Ron0001_bot        特助（Ron）
# nicky-zhanglinghe 張凌赫  @ZhangLingheAI_bot  特助（Nicky）
# chltao          Elon       @chltao_bot         特助（桃桃）
# caijie-zhuchu   主廚       @CarrotAAA_bot      特助（菜姐）
# wes-buddy       Wes_buddy  @Wes_buddy_bot      特助（Wes）
# stargazer       觀星者     @stargazer_chlbot   特助（小米）
# anna            Anna       @annadesu_bot       Builder
# sancai          三菜       @threedishes_bot    Builder
# eric     Eric       @Ron0002_bot        Builder
