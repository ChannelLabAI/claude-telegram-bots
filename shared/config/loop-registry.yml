# 政策原文：shared/blocks/block-channel-loop-governance.md
# 存量條目為 2026-07-25 依 logs/ 與已知配置自動種子（status: unverified），
# 8/1 月度 comprehension-debt 審查做全量盤點：補欄位、標重疊、砍冗餘。

